name: patient-management

services:
  # --------------------------
  # Databases (MySQL)
  # --------------------------
  patient-service-db:
    image: mysql:8
    container_name: patient-service-db
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: ${PATIENT_DB_USER:-mysql}
      MYSQL_PASSWORD: ${PATIENT_DB_PASSWORD:-password}
      MYSQL_DATABASE: ${PATIENT_DB_NAME:-db}
    ports:
      - "${PATIENT_DB_HOST_PORT:-5000}:3306"
    volumes:
      - patient_service_db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${PATIENT_DB_USER:-mysql}", "-p${PATIENT_DB_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth-service-db:
    image: mysql:8
    container_name: auth-service-db
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: ${AUTH_DB_USER:-mysql}
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD:-password}
      MYSQL_DATABASE: ${AUTH_DB_NAME:-db}
    ports:
      - "${AUTH_DB_HOST_PORT:-5001}:3306"
    volumes:
      - auth_service_db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${AUTH_DB_USER:-mysql}", "-p${AUTH_DB_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  appointment-service-db:
    image: mysql:8
    container_name: appointment-service-db
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: ${APPT_DB_USER:-mysql}
      MYSQL_PASSWORD: ${APPT_DB_PASSWORD:-password}
      MYSQL_DATABASE: ${APPT_DB_NAME:-db}
    ports:
      - "${APPT_DB_HOST_PORT:-5003}:3306"
    volumes:
      - appointment_service_db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${APPT_DB_USER:-mysql}", "-p${APPT_DB_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --------------------------
  # Redis
  # --------------------------
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - internal
    restart: unless-stopped

  # --------------------------
  # apache/kafka (KRaft)
  # --------------------------
  Kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - internal
    restart: unless-stopped

  # --------------------------
  # Microservices
  # --------------------------
  appointment-service:
    build:
      context: ./appointment-service
      dockerfile: Dockerfile
    image: appointment-service:latest
    container_name: appointment-service
    ports:
      - "${APPOINTMENT_SERVICE_PORT:-4006}:4006"
    networks:
      - internal
    depends_on:
      appointment-service-db:
        condition: service_healthy
      Kafka:
        condition: service_started
    restart: unless-stopped

  billing-service:
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    image: billing-service:latest
    container_name: billing-service
    ports:
      - "${BILLING_SERVICE_PORT:-4001}:4001"
      - "${BILLING_GRPC_PORT:-9001}:9001"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - internal
    depends_on:
      Kafka:
        condition: service_started
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: auth-service:latest
    container_name: auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-4005}:4005"
    environment:
      JWT_SECRET: ${JWT_SECRET}

      SPRING_DATASOURCE_URL: jdbc:mysql://auth-service-db:3306/${AUTH_DB_NAME:-db}?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER:-mysql}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-password}

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      SERVER_PORT: "4005"
    networks:
      - internal
    depends_on:
      auth-service-db:
        condition: service_healthy
    restart: unless-stopped

  patient-service:
    build:
      context: ./patient-service
      dockerfile: Dockerfile
    image: patient-service:latest
    container_name: patient-service
    ports:
      - "${PATIENT_SERVICE_PORT:-4000}:4000"
    environment:
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: "9001"

      SPRING_CACHE_TYPE: redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"

      SPRING_DATASOURCE_URL: jdbc:mysql://patient-service-db:3306/${PATIENT_DB_NAME:-db}?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${PATIENT_DB_USER:-mysql}
      SPRING_DATASOURCE_PASSWORD: ${PATIENT_DB_PASSWORD:-password}

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_SQL_INIT_MODE: always
      SERVER_PORT: "4000"
    networks:
      - internal
    depends_on:
      patient-service-db:
        condition: service_healthy
      redis:
        condition: service_started
      Kafka:
        condition: service_started
      billing-service:
        condition: service_started
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: api-gateway:latest
    container_name: api-gateway
    ports:
      - "${API_GATEWAY_PORT:-4004}:4004"
    environment:
      AUTH_SERVICE_URL: http://auth-service:${AUTH_SERVICE_PORT:-4005}
      SERVER_PORT: "4004"
    networks:
      - internal
    depends_on:
      auth-service:
        condition: service_started
    restart: unless-stopped

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    image: analytics-service:latest
    container_name: analytics-service
    ports:
      - "${ANALYTICS_SERVICE_PORT:-4002}:4002"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: "4002"
    networks:
      - internal
    depends_on:
      Kafka:
        condition: service_started
    restart: unless-stopped

  # --------------------------
  # Monitoring (enable via profile)
  # --------------------------
  Prometheus:
    image: prom/prometheus:latest
    container_name: Prometheus
    profiles: ["monitoring"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - internal
    restart: unless-stopped

  Grafana:
    image: grafana/grafana:latest
    container_name: Grafana
    profiles: ["monitoring"]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    name: internal

volumes:
  patient_service_db_data:
  auth_service_db_data:
  appointment_service_db_data:
  grafana_data: